server {
    listen 80;
    root /usr/share/nginx/html;

    # Resolve the api container per request (Docker's embedded DNS), so the web
    # container still starts - and answers /api/* with a plain 502 the client
    # classifies as "backend unreachable" - when the api container is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        # A stopped container's IP just drops packets; fail fast with a 504
        # (still "unreachable" to the client) instead of hanging for 60s.
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }

    location /health {
        proxy_pass $api_upstream;
    }

    location / {
        try_files $uri /index.html;
    }
}
